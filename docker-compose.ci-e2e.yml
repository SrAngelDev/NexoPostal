# ============================================
# NEXOPOSTAL — Entorno para tests E2E en CI
# ============================================
# Usa las mismas imágenes de GHCR que producción, pero con nginx en HTTP
# (sin SSL) y con los puertos del host expuestos para que Playwright
# pueda acceder a las tres aplicaciones desde el runner de GitHub Actions.
#
# Uso (desde la raíz del proyecto):
#   docker compose --env-file ./.env -f docker-compose.ci-e2e.yml pull
#   docker compose --env-file ./.env -f docker-compose.ci-e2e.yml up -d
#
# Variables necesarias en .env:
#   IMAGE_TAG, GHCR_NAMESPACE, todas las contraseñas de BD, JWT, etc.

services:

  # --- NGINX (HTTP sin SSL, tres apps en tres puertos) ---
  reverse-proxy:
    image: nginx:alpine
    container_name: nexopostal-proxy-ci
    ports:
      - "80:80"      # Portal de clientes  → http://localhost:80
      - "8202:4202"  # Intranet            → http://localhost:8202
      - "8201:4201"  # App de repartidores → http://localhost:8201
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - clientes-app
      - intranet-app
      - driver-app
      - api-gateway
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # --- API GATEWAY ---
  api-gateway:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-api-gateway:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Microservices__Auth=${URL_MODULO_SEGURIDAD}
      - Microservices__Ciudadano=${URL_MODULO_CIUDADANO}
      - Microservices__Logistica=${URL_MODULO_LOGISTICA}
      - Microservices__Reparto=${URL_MODULO_REPARTO}
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      - modulo-seguridad
      - modulo-ciudadano
      - modulo-logistica
      - modulo-reparto

  # --- FRONTENDS (Angular SPA) ---
  clientes-app:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-clientes-app:${IMAGE_TAG:-latest}
    networks:
      - nexopostal-net

  intranet-app:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-intranet-app:${IMAGE_TAG:-latest}
    networks:
      - nexopostal-net

  driver-app:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-driver-app:${IMAGE_TAG:-latest}
    networks:
      - nexopostal-net

  # --- MICROSERVICIOS ---
  modulo-seguridad:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-modulo-seguridad:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      postgres-auth:
        condition: service_healthy

  modulo-ciudadano:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-modulo-ciudadano:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - InterServiceSettings__ServiceKey=${INTER_SERVICE_KEY}
      - CiudadanoSettings__ServiceKey=${INTER_SERVICE_KEY}
      - IntranetSettings__ServiceKey=${INTER_SERVICE_KEY}
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      postgres-ciudadano:
        condition: service_healthy

  modulo-logistica:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-modulo-logistica:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - InterServiceSettings__ServiceKey=${INTER_SERVICE_KEY}
      - CiudadanoSettings__ServiceKey=${INTER_SERVICE_KEY}
      - IntranetSettings__ServiceKey=${INTER_SERVICE_KEY}
      - RepartoSettings__BaseUrl=http://modulo-reparto
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      postgres-intranet:
        condition: service_healthy

  modulo-reparto:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-modulo-reparto:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - InterServiceSettings__ServiceKey=${INTER_SERVICE_KEY}
      - AuthSettings__BaseUrl=http://modulo-seguridad
      - AuthSettings__ServiceKey=${INTER_SERVICE_KEY}
      - CiudadanoTrackingSettings__BaseUrl=http://modulo-ciudadano
      - CiudadanoTrackingSettings__ServiceKey=${INTER_SERVICE_KEY}
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      postgres-reparto:
        condition: service_healthy

  # --- BASES DE DATOS (solo red interna, sin puertos expuestos al host) ---
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ciudadano:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_CIUDADANO_DB}
      POSTGRES_USER: ${POSTGRES_CIUDADANO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CIUDADANO_PASSWORD}
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CIUDADANO_USER} -d ${POSTGRES_CIUDADANO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-intranet:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_INTRANET_DB}
      POSTGRES_USER: ${POSTGRES_INTRANET_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INTRANET_PASSWORD}
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_INTRANET_USER} -d ${POSTGRES_INTRANET_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-reparto:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_REPARTO_DB}
      POSTGRES_USER: ${POSTGRES_REPARTO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_REPARTO_PASSWORD}
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPARTO_USER} -d ${POSTGRES_REPARTO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  nexopostal-net:
    driver: bridge
