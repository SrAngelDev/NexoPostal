# ============================================
# nginx.production.conf - Producción CON SSL
# ============================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name nexopostal.es intranet.nexopostal.es driver.nexopostal.es;
    return 301 https://$host$request_uri;
}

# --- CLIENTES (nexopostal.es) ---
server {
    listen 443 ssl;
    server_name nexopostal.es;

    ssl_certificate /etc/nginx/certs/nexopostal.crt;
    ssl_certificate_key /etc/nginx/certs/nexopostal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /hubs/tracking {
        proxy_pass http://modulo-ciudadano:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://clientes-app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}

# --- INTRANET (intranet.nexopostal.es) ---
