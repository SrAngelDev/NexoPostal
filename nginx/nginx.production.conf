# ============================================
# nginx.production.conf - Producción CON SSL
# ============================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name nexopostal.es intranet.nexopostal.es driver.nexopostal.es;
    return 301 https://$host$request_uri;
}

# --- CLIENTES (nexopostal.es) ---
server {
    listen 443 ssl;
    server_name nexopostal.es;

    ssl_certificate /etc/nginx/certs/nexopostal.crt;
    ssl_certificate_key /etc/nginx/certs/nexopostal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_modulo_ciudadano http://modulo-ciudadano:80;
    set $upstream_api_gateway http://api-gateway:80;
    set $upstream_front_clientes http://clientes-app:80;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /hubs/tracking {
        proxy_pass $upstream_modulo_ciudadano;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass $upstream_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass $upstream_front_clientes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}

# --- INTRANET (intranet.nexopostal.es) ---
