# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name nexopostal.es intranet.nexopostal.es driver.nexopostal.es;
    return 301 https://$host$request_uri;
}

# --- 1. CLIENTE (nexopostal.es) ---
server {
    listen 443 ssl;
    server_name nexopostal.es;

    ssl_certificate /etc/nginx/certs/nexopostal.crt;
    ssl_certificate_key /etc/nginx/certs/nexopostal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # SignalR Hub — WebSocket para tracking en tiempo real (clientes)
    location /hubs/tracking {
        proxy_pass http://modulo-ciudadano:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API Gateway - Llamadas al backend (evita CORS)
    location /api/ {
        proxy_pass http://api-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    location / {
        proxy_pass http://clientes-app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- 2. INTRANET (intranet.nexopostal.es) ---
server {
    listen 443 ssl;
    server_name intranet.nexopostal.es;

    ssl_certificate /etc/nginx/certs/nexopostal.crt;
    ssl_certificate_key /etc/nginx/certs/nexopostal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # SignalR Hub — WebSocket + fallbacks
    location /hubs/ {
        proxy_pass http://modulo-logistica:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API Intranet directa (operarios, admision, asignaciones, ctas, movimientos, incidencias, historial, oficinas postales, scan)
    location ~ ^/api/(operarios|admision|asignaciones|ctas|movimientos|incidencias|historial|oficinaspostales|scan)(/|$) {
        proxy_pass http://modulo-logistica:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # API Gateway — Llamadas al backend (auth, envíos, etc.)
    location /api/ {
        proxy_pass http://api-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Frontend Angular - Intranet
    location / {
        proxy_pass http://intranet-app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- 3. DRIVER (driver.nexopostal.es) ---
