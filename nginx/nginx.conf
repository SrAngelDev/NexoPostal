# ============================================
# nginx.conf - NexoPostal Production
# ============================================

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name nexopostal.es intranet.nexopostal.es driver.nexopostal.es;
    return 301 https://$host$request_uri;
}

# --- 1. CLIENTE (nexopostal.es) ---
server {
    listen 443 ssl;
    server_name nexopostal.es;

    ssl_certificate /etc/nginx/certs/nexopostal.crt;
    ssl_certificate_key /etc/nginx/certs/nexopostal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_modulo_ciudadano http://modulo-ciudadano:80;
    set $upstream_api_gateway http://api-gateway:80;
    set $upstream_front_clientes http://clientes-app:80;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-When-Downgrade" always;

    # SignalR Hub
    location /hubs/tracking {
        proxy_pass $upstream_modulo_ciudadano;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API Gateway
    location /api/ {
        proxy_pass $upstream_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Frontend Angular
    location / {
        proxy_pass $upstream_front_clientes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

