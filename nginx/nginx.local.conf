# ============================================
# nginx.local.conf - Desarrollo Local SIN SSL
# ============================================

# DNS interno de Docker para evitar cacheo de IPs antiguas al reiniciar contenedores
resolver 127.0.0.11 valid=10s ipv6=off;

# --- CLIENTES (puerto 80) ---
server {
    listen 80;
    server_name localhost;
    set $upstream_modulo_ciudadano http://modulo-ciudadano:80;
    set $upstream_api_gateway http://api-gateway:80;
    set $upstream_front_clientes http://clientes-app:80;

    location /hubs/tracking {
        proxy_pass $upstream_modulo_ciudadano;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass $upstream_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    location / {
        proxy_pass $upstream_front_clientes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}

# --- INTRANET (puerto 4202) ---
server {
    listen 4202;
    server_name localhost;
    set $upstream_modulo_logistica http://modulo-logistica:80;
    set $upstream_api_gateway http://api-gateway:80;
    set $upstream_front_intranet http://intranet-app:80;

    location /hubs/ {
        proxy_pass $upstream_modulo_logistica;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $upstream_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass $upstream_front_intranet;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}

# --- DRIVER (puerto 4201) ---
server {
    listen 4201;
    server_name localhost;
    set $upstream_api_gateway http://api-gateway:80;
    set $upstream_front_driver http://driver-app:80;
    set $upstream_modulo_reparto http://modulo-reparto:80;

    location /hubs/ {
        proxy_pass $upstream_modulo_reparto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass $upstream_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass $upstream_front_driver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
}