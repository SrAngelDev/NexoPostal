# ═══════════════════════════════════════════════════════
#  NexoPostal - Docker Compose Producción
#  Incluye: monitorización, watchtower, logs
# ═══════════════════════════════════════════════════════
services:

  # ─── Watchtower: Actualizaciones automáticas de contenedores ───
  watchtower:
    image: containrrr/watchtower
    container_name: nexopostal-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_ROLLING_RESTART=true
    restart: unless-stopped

  # ─── Prometheus: Recolección de métricas ───
  prometheus:
    image: prom/prometheus:latest
    container_name: nexopostal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  # ─── Grafana: Dashboards de monitorización ───
  grafana:
    image: grafana/grafana:latest
    container_name: nexopostal-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-nexopostal2025}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Loki: Agregación de logs ───
  loki:
    image: grafana/loki:latest
    container_name: nexopostal-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # ─── Promtail: Recolector de logs para Loki ───
  promtail:
    image: grafana/promtail:latest
    container_name: nexopostal-promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
