name: CI/CD NexoPostal - Deploy to VPS

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}

jobs:
  # ═══════════════════════════════════════
  # BUILD - Backend (.NET)
  # ═══════════════════════════════════════
  build-backend:
    name: Build Backend .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservicios/Nexopostal

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build all microservices
        run: |
          dotnet build Nexopostal.Auth/Nexopostal.Auth.csproj --no-restore
          dotnet build Nexopostal.Ciudadano/Nexopostal.Ciudadano.csproj --no-restore
          dotnet build Nexopostal.Intranet/Nexopostal.Intranet.csproj --no-restore
          dotnet build Nexopostal.Reparto/Nexopostal.Reparto.csproj --no-restore
          dotnet build Nexopostal.Gateway/Nexopostal.Gateway.csproj --no-restore

  # ═══════════════════════════════════════
  # BUILD - Frontend (Angular)
  # ═══════════════════════════════════════
  build-frontend:
    name: Build Frontend Angular
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [clientes-app, intranet-app, driver-app]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build -- --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}/dist/

  # ═══════════════════════════════════════
  # DOCKER BUILD (paralelo por imagen)
  # ═══════════════════════════════════════
  docker-build:
    name: Build ${{ matrix.service.name }}
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false   # si una imagen falla, las demás siguen construyéndose
      matrix:
        service:
          - name: modulo-seguridad
            context: microservicios/Nexopostal
            dockerfile: microservicios/Nexopostal/Nexopostal.Auth/Dockerfile
          - name: modulo-ciudadano
            context: microservicios/Nexopostal
            dockerfile: microservicios/Nexopostal/Nexopostal.Ciudadano/Dockerfile
          - name: modulo-logistica
            context: microservicios/Nexopostal
            dockerfile: microservicios/Nexopostal/Nexopostal.Intranet/Dockerfile
          - name: modulo-reparto
            context: microservicios/Nexopostal
            dockerfile: microservicios/Nexopostal/Nexopostal.Reparto/Dockerfile
          - name: api-gateway
            context: microservicios/Nexopostal
            dockerfile: microservicios/Nexopostal/Nexopostal.Gateway/Dockerfile
          - name: clientes-app
            context: clientes-app
            dockerfile: clientes-app/Dockerfile
          - name: intranet-app
            context: intranet-app
            dockerfile: intranet-app/Dockerfile
          - name: driver-app
            context: driver-app
            dockerfile: driver-app/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        run: |
          docker build \
            -t nexopostal-${{ matrix.service.name }}:latest \
            -f ${{ matrix.service.dockerfile }} \
            ${{ matrix.service.context }}

  # ═══════════════════════════════════════
  # DEPLOY TO VPS
  # ═══════════════════════════════════════
  deploy-vps:
    name: Deploy to VPS DigitalOcean
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        # Carga la clave PEM tal cual en un agente ssh, sin codificación base64
        # ni manipulaciones de saltos de línea. El secreto VPS_SSH_PRIVATE_KEY
        # debe pegarse íntegro (con cabecera -----BEGIN ... ----- y final
        # -----END ... -----) en GitHub Secrets.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ env.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy and Inject .env to VPS
        run: |
          set -euo pipefail

          # ── 1. Construir .env de producción desde secrets individuales ──────────
          # Cada variable sensible es un secreto de GitHub independiente.
          # De esta forma NUNCA hay credenciales en el código ni en la imagen Docker.
          cat > .env <<EOF
          ASPNETCORE_ENVIRONMENT=Production

          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          JWT_EXPIRY_MINUTES=60

          POSTGRES_AUTH_HOST=postgres-auth
          POSTGRES_AUTH_PORT=5432
          POSTGRES_AUTH_DB=nexopostal_auth
          POSTGRES_AUTH_USER=postgres
          POSTGRES_AUTH_PASSWORD=${{ secrets.POSTGRES_AUTH_PASSWORD }}

          POSTGRES_CIUDADANO_HOST=postgres-ciudadano
          POSTGRES_CIUDADANO_PORT=5432
          POSTGRES_CIUDADANO_DB=nexopostal_ciudadano
          POSTGRES_CIUDADANO_USER=postgres
          POSTGRES_CIUDADANO_PASSWORD=${{ secrets.POSTGRES_CIUDADANO_PASSWORD }}

          POSTGRES_INTRANET_HOST=postgres-intranet
          POSTGRES_INTRANET_PORT=5432
          POSTGRES_INTRANET_DB=nexopostal_intranet
          POSTGRES_INTRANET_USER=postgres
          POSTGRES_INTRANET_PASSWORD=${{ secrets.POSTGRES_INTRANET_PASSWORD }}

          POSTGRES_REPARTO_HOST=postgres-reparto
          POSTGRES_REPARTO_PORT=5432
          POSTGRES_REPARTO_DB=nexopostal_reparto
          POSTGRES_REPARTO_USER=postgres
          POSTGRES_REPARTO_PASSWORD=${{ secrets.POSTGRES_REPARTO_PASSWORD }}

          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}

          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USESSL=${{ secrets.SMTP_USESSL }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME=NexoPostal
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}

          INTER_SERVICE_KEY=${{ secrets.INTER_SERVICE_KEY }}
          INTRANET_BASE_URL=http://modulo-logistica:80

          URL_MODULO_SEGURIDAD=http://modulo-seguridad:80
          URL_MODULO_CIUDADANO=http://modulo-ciudadano:80
          URL_MODULO_LOGISTICA=http://modulo-logistica:80
          URL_MODULO_REPARTO=http://modulo-reparto:80
          URL_API_GATEWAY=http://api-gateway:80

          NGINX_HTTP_PORT=80
          NGINX_HTTPS_PORT=443
          EOF

          # ── 2. Transferir código + .env al VPS (sin .git ni node_modules) ──────
          # Excluimos nginx/certs para no sobreescribir los certificados
          # Let's Encrypt que viven en el VPS.
          rsync -avz \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'nginx/certs' \
            . ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:~/nexopostal

          # ── 3. Levantar la infraestructura en el VPS ─────────────────────────
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
          set -euo pipefail
          cd ~/nexopostal
          if command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            DC="docker compose"
          fi
          $DC --env-file ./.env -f docker-compose.production.yml down
          $DC --env-file ./.env -f docker-compose.production.yml build --no-cache
          $DC --env-file ./.env -f docker-compose.production.yml up -d
          ENDSSH

      - name: Verify deployment
        run: |
          sleep 10
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "docker ps"

      - name: Health check
        run: |
          curl -f https://nexopostal.es/ || exit 0
          curl -f https://intranet.nexopostal.es/ || exit 0
          curl -f https://driver.nexopostal.es/ || exit 0