name: CI/CD NexoPostal

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/nexopostal

jobs:
  # ═══════════════════════════════════════
  #  BUILD & TEST - Backend (.NET)
  # ═══════════════════════════════════════
  backend-build:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservicios/Nexopostal

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build all microservices
        run: |
          dotnet build Nexopostal.Auth/Nexopostal.Auth.csproj --no-restore
          dotnet build Nexopostal.Ciudadano/Nexopostal.Ciudadano.csproj --no-restore
          dotnet build Nexopostal.Intranet/Nexopostal.Intranet.csproj --no-restore
          dotnet build Nexopostal.Reparto/Nexopostal.Reparto.csproj --no-restore
          dotnet build Nexopostal.Gateway/Nexopostal.Gateway.csproj --no-restore

      - name: Run unit tests
        run: dotnet test --no-build --verbosity normal --logger trx --results-directory TestResults
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: microservicios/Nexopostal/TestResults

  # ═══════════════════════════════════════
  #  BUILD & TEST - Frontend (Angular)
  # ═══════════════════════════════════════
  frontend-build:
    name: Build Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [clientes-app, intranet-app, driver-app]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build -- --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}/dist/

  # ═══════════════════════════════════════
  #  DOCKER BUILD & PUSH
  # ═══════════════════════════════════════
  docker-build:
    name: Docker Build & Push
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=develop" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Auth
        uses: docker/build-push-action@v6
        with:
          context: microservicios/Nexopostal/Nexopostal.Auth
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:${{ steps.tag.outputs.TAG }}

      - name: Build and push Ciudadano
        uses: docker/build-push-action@v6
        with:
          context: microservicios/Nexopostal/Nexopostal.Ciudadano
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ciudadano:${{ steps.tag.outputs.TAG }}

      - name: Build and push Intranet
        uses: docker/build-push-action@v6
        with:
          context: microservicios/Nexopostal/Nexopostal.Intranet
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-intranet:${{ steps.tag.outputs.TAG }}

      - name: Build and push Reparto
        uses: docker/build-push-action@v6
        with:
          context: microservicios/Nexopostal/Nexopostal.Reparto
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-reparto:${{ steps.tag.outputs.TAG }}

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: microservicios/Nexopostal/Nexopostal.Gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gateway:${{ steps.tag.outputs.TAG }}

  # ═══════════════════════════════════════
  #  DEPLOY
  # ═══════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          echo "Deploying to staging environment..."
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d

  deploy-production:
    name: Deploy to Production
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          echo "Deploying to production environment..."
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d
