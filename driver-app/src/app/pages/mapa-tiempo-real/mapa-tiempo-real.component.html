<div class="mapa-page">
  <app-driver-navbar icon="my_location" title="Mapa en tiempo real" [subtitle]="navSubtitle()" (backClick)="volver()">
    <button class="nav-action-btn" (click)="refrescar()" [disabled]="cargando()" title="Refrescar">
      <span class="material-symbols-outlined" [class.spinning]="cargando()">refresh</span>
    </button>
  </app-driver-navbar>

  @if (error(); as e) {
    <div class="error-banner">
      <span class="material-symbols-outlined">error</span>
      {{ e }}
    </div>
  }

  <div id="mapa" class="mapa-canvas"></div>
</div>
