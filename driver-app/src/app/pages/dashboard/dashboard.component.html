<div class="dashboard-page">
  <app-driver-navbar [showBack]="false" icon="local_shipping" title="NexoPostal — Repartidores" />
  <main class="dashboard-main">
    <h2 class="dashboard-title">Panel de Reparto</h2>
    <p class="dashboard-subtitle">
      Bienvenido al sistema de gestión de repartos de NexoPostal.
    </p>

    <div class="dashboard-cards">
      <button class="dashboard-card" (click)="navigateTo('/ruta')">
        <div class="card-icon-wrapper card-icon-route">
          <span class="material-symbols-outlined">route</span>
        </div>
        <div class="card-body">
          <h3 class="card-title">Ruta activa y paradas</h3>
          <p class="card-desc">Visualiza tu ruta del día, confirma entregas por parada y sincroniza GPS en tiempo real.</p>
        </div>
        <span class="material-symbols-outlined card-arrow">arrow_forward</span>
      </button>

      <button class="dashboard-card" (click)="navigateTo('/escaneo')">
        <div class="card-icon-wrapper card-icon-scan">
          <span class="material-symbols-outlined">qr_code_scanner</span>
        </div>
        <div class="card-body">
          <h3 class="card-title">Escanear paquetes</h3>
          <p class="card-desc">Escaneo rápido por número de expedición para consulta puntual y acciones manuales.</p>
        </div>
        <span class="material-symbols-outlined card-arrow">arrow_forward</span>
      </button>
    </div>
  </main>
</div>
