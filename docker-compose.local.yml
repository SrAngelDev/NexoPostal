# ============================================
# NEXOPOSTAL - Desarrollo Local
# ============================================
# Uso: docker compose -f docker-compose.local.yml --env-file .env up -d --build
#
# CLAVES:
# - `env_file: ./.env` carga TODAS las vars del .env DENTRO del contenedor
#   (esto es lo que permite que Program.cs lea Environment.GetEnvironmentVariable).
# - `environment:` se usa para overrides fijos del entorno (ASPNETCORE_URLS, etc.).
# - `${VAR}` en este YAML se sustituye con valores del .env (interpolación de compose).
# - Frontends (Angular SPA) usan paths relativos /api/* → no necesitan ARG en build.

services:
  # --- NGINX PROXY (SIN SSL) ---
  reverse-proxy:
    image: nginx:alpine
    container_name: nexopostal-proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "4202:4202"
      - "4201:4201"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - clientes-app
      - intranet-app
      - driver-app
      - api-gateway
    networks:
      - nexopostal-net
    restart: unless-stopped

  # --- API GATEWAY ---
  api-gateway:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_URLS=http://+:80
      - Microservices__Auth=${URL_MODULO_SEGURIDAD}
      - Microservices__Ciudadano=${URL_MODULO_CIUDADANO}
      - Microservices__Logistica=${URL_MODULO_LOGISTICA}
      - Microservices__Reparto=${URL_MODULO_REPARTO}
    networks:
      - nexopostal-net
    depends_on:
      - modulo-seguridad
      - modulo-ciudadano
      - modulo-logistica
      - modulo-reparto
    restart: unless-stopped

  # --- FRONTENDS (SPA: build-time => no envs aquí) ---
  clientes-app:
    build: ./clientes-app
    container_name: clientes-app
    networks:
      - nexopostal-net
    restart: unless-stopped

  intranet-app:
    build: ./intranet-app
    container_name: intranet-app
    networks:
      - nexopostal-net
    restart: unless-stopped

  driver-app:
    build: ./driver-app
    container_name: driver-app
    networks:
      - nexopostal-net
    restart: unless-stopped

  # --- MICROSERVICIOS ---
  modulo-seguridad:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Auth/Dockerfile
    container_name: modulo-seguridad
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_URLS=http://+:80
    networks:
      - nexopostal-net
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped

  modulo-ciudadano:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Ciudadano/Dockerfile
    container_name: modulo-ciudadano
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_URLS=http://+:80
    networks:
      - nexopostal-net
    depends_on:
      postgres-ciudadano:
        condition: service_healthy
    restart: unless-stopped

  modulo-logistica:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Intranet/Dockerfile
    container_name: modulo-logistica
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_URLS=http://+:80
    networks:
      - nexopostal-net
    depends_on:
      postgres-intranet:
        condition: service_healthy
    restart: unless-stopped

  modulo-reparto:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Reparto/Dockerfile
    container_name: modulo-reparto
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_URLS=http://+:80
    networks:
      - nexopostal-net
    depends_on:
      postgres-reparto:
        condition: service_healthy
    restart: unless-stopped

  # --- BASES DE DATOS ---
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-ciudadano:
    image: postgres:16-alpine
    container_name: postgres-ciudadano
    environment:
      POSTGRES_DB: ${POSTGRES_CIUDADANO_DB}
      POSTGRES_USER: ${POSTGRES_CIUDADANO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CIUDADANO_PASSWORD}
    ports:
      - "15433:5432"
    volumes:
      - postgres-ciudadano-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CIUDADANO_USER} -d ${POSTGRES_CIUDADANO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-intranet:
    image: postgres:16-alpine
    container_name: postgres-intranet
    environment:
      POSTGRES_DB: ${POSTGRES_INTRANET_DB}
      POSTGRES_USER: ${POSTGRES_INTRANET_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INTRANET_PASSWORD}
    ports:
      - "15434:5432"
    volumes:
      - postgres-intranet-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_INTRANET_USER} -d ${POSTGRES_INTRANET_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-reparto:
    image: postgres:16-alpine
    container_name: postgres-reparto
    environment:
      POSTGRES_DB: ${POSTGRES_REPARTO_DB}
      POSTGRES_USER: ${POSTGRES_REPARTO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_REPARTO_PASSWORD}
    ports:
      - "15435:5432"
    volumes:
      - postgres-reparto-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPARTO_USER} -d ${POSTGRES_REPARTO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nexopostal-net:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-ciudadano-data:
  postgres-intranet-data:
  postgres-reparto-data:
