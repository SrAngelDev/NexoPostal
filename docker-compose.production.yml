# ============================================
# NEXOPOSTAL - PRODUCCIÓN
# ============================================
# Uso: docker compose --env-file ./.env -f docker-compose.production.yml pull && docker compose --env-file ./.env -f docker-compose.production.yml up -d --no-build
#
# Características:
# - Con SSL (nginx con certificados)
# - Solo puertos 80/443 expuestos
# - Sin puertos de BD expuestos (red interna)
# - Deploy basado en imagenes (GHCR) para evitar build en VPS
# - Variables sensibles vienen 100% del .env (inyectado por GitHub Actions)
#
# IMPORTANTE:
# - `env_file: ./.env` carga TODAS las vars al contenedor (lo que .NET necesita).
# - Las claves JWT/Stripe/SMTP DEBEN llegar a TODOS los .NET, no solo a Auth,
#   porque appsettings.json usa ${VAR} y ResolveConfigValue resuelve por env.

services:
  # --- NGINX PROXY (CON SSL) ---
  reverse-proxy:
    image: nginx:alpine
    container_name: nexopostal-proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - clientes-app
      - intranet-app
      - driver-app
      - api-gateway
    networks:
      - nexopostal-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- API GATEWAY ---
  api-gateway:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-api-gateway:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Microservices__Auth=${URL_MODULO_SEGURIDAD}
      - Microservices__Ciudadano=${URL_MODULO_CIUDADANO}
      - Microservices__Logistica=${URL_MODULO_LOGISTICA}
      - Microservices__Reparto=${URL_MODULO_REPARTO}
    networks:
      - nexopostal-net
    depends_on:
      - modulo-seguridad
      - modulo-ciudadano
      - modulo-logistica
      - modulo-reparto
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --- FRONTENDS (SPA Angular: usan paths relativos, nada que inyectar) ---
  clientes-app:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-clientes-app:${IMAGE_TAG:-latest}
    networks:
      - nexopostal-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  intranet-app:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-intranet-app:${IMAGE_TAG:-latest}
    networks:
      - nexopostal-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  driver-app:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-driver-app:${IMAGE_TAG:-latest}
    networks:
      - nexopostal-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # --- MICROSERVICIOS ---
  modulo-seguridad:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-modulo-seguridad:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    networks:
      - nexopostal-net
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  modulo-ciudadano:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-modulo-ciudadano:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - InterServiceSettings__ServiceKey=${INTER_SERVICE_KEY}
      - CiudadanoSettings__ServiceKey=${INTER_SERVICE_KEY}
      - IntranetSettings__ServiceKey=${INTER_SERVICE_KEY}
    networks:
      - nexopostal-net
    depends_on:
      postgres-ciudadano:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  modulo-logistica:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-modulo-logistica:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - InterServiceSettings__ServiceKey=${INTER_SERVICE_KEY}
      - CiudadanoSettings__ServiceKey=${INTER_SERVICE_KEY}
      - IntranetSettings__ServiceKey=${INTER_SERVICE_KEY}
    networks:
      - nexopostal-net
    depends_on:
      postgres-intranet:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  modulo-reparto:
    image: ghcr.io/${GHCR_NAMESPACE:-srangeldev}/nexopostal-modulo-reparto:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - InterServiceSettings__ServiceKey=${INTER_SERVICE_KEY}
    networks:
      - nexopostal-net
    depends_on:
      postgres-reparto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --- BASES DE DATOS (solo red interna) ---
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres-ciudadano:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_CIUDADANO_DB}
      POSTGRES_USER: ${POSTGRES_CIUDADANO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CIUDADANO_PASSWORD}
    volumes:
      - postgres-ciudadano-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CIUDADANO_USER} -d ${POSTGRES_CIUDADANO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres-intranet:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_INTRANET_DB}
      POSTGRES_USER: ${POSTGRES_INTRANET_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INTRANET_PASSWORD}
    volumes:
      - postgres-intranet-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_INTRANET_USER} -d ${POSTGRES_INTRANET_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres-reparto:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_REPARTO_DB}
      POSTGRES_USER: ${POSTGRES_REPARTO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_REPARTO_PASSWORD}
    volumes:
      - postgres-reparto-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPARTO_USER} -d ${POSTGRES_REPARTO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  nexopostal-net:

volumes:
  postgres-auth-data:
  postgres-ciudadano-data:
  postgres-intranet-data:
  postgres-reparto-data:
