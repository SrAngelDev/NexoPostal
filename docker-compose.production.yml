# ============================================
# docker-compose.production.yml
# NexoPostal - Producción
# ============================================
# Uso: cp .env .env.production && nano .env.production && docker-compose -f docker-compose.production.yml up -d

services:
  # ============================================
  # PROXY INVERSO (Nginx)
  # ============================================
  reverse-proxy:
    image: nginx:alpine
    container_name: nexopostal-proxy
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - clientes-app
      - intranet-app
      - driver-app
      - api-gateway
    networks:
      - nexopostal-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # API GATEWAY
  # ============================================
  api-gateway:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Gateway/Dockerfile
    container_name: nexopostal-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - Microservices__Auth=${URL_MODULO_SEGURIDAD}
      - Microservices__Ciudadano=${URL_MODULO_CIUDADANO}
      - Microservices__Logistica=${URL_MODULO_LOGISTICA}
      - Microservices__Reparto=${URL_MODULO_REPARTO}
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      modulo-seguridad:
        condition: service_started
      modulo-ciudadano:
        condition: service_started
      modulo-logistica:
        condition: service_started
      modulo-reparto:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # FRONTENDS (Angular)
  # ============================================
  clientes-app:
    build:
      context: ./clientes-app
      dockerfile: Dockerfile
    container_name: nexopostal-clientes-app
    environment:
      - NODE_ENV=production
    networks:
      - nexopostal-net
    restart: unless-stopped

  intranet-app:
    build:
      context: ./intranet-app
      dockerfile: Dockerfile
    container_name: nexopostal-intranet-app
    environment:
      - NODE_ENV=production
    networks:
      - nexopostal-net
    restart: unless-stopped

  driver-app:
    build:
      context: ./driver-app
      dockerfile: Dockerfile
    container_name: nexopostal-driver-app
    environment:
      - NODE_ENV=production
    networks:
      - nexopostal-net
    restart: unless-stopped

  # ============================================
  # MICROSERVICIOS (.NET)
  # ============================================
  modulo-seguridad:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Auth/Dockerfile
    container_name: nexopostal-modulo-seguridad
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_AUTH_HOST};Port=${POSTGRES_AUTH_PORT};Database=${POSTGRES_AUTH_DB};Username=${POSTGRES_AUTH_USER};Password=${POSTGRES_AUTH_PASSWORD}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES}
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped

  modulo-ciudadano:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Ciudadano/Dockerfile
    container_name: nexopostal-modulo-ciudadano
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_CIUDADANO_HOST};Port=${POSTGRES_CIUDADANO_PORT};Database=${POSTGRES_CIUDADANO_DB};Username=${POSTGRES_CIUDADANO_USER};Password=${POSTGRES_CIUDADANO_PASSWORD}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
      - SmtpSettings__Host=${SMTP_HOST}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__UseSsl=${SMTP_USESSL}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromName=${SMTP_FROM_NAME}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL}
      - IntranetSettings__BaseUrl=${INTRANET_BASE_URL}
      - InterServiceSettings__ServiceKey=${INTER_SERVICE_KEY}
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      postgres-ciudadano:
        condition: service_healthy
    restart: unless-stopped

  modulo-logistica:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Intranet/Dockerfile
    container_name: nexopostal-modulo-logistica
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_INTRANET_HOST};Port=${POSTGRES_INTRANET_PORT};Database=${POSTGRES_INTRANET_DB};Username=${POSTGRES_INTRANET_USER};Password=${POSTGRES_INTRANET_PASSWORD}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES}
      - InterServiceSettings__ServiceKey=${INTER_SERVICE_KEY}
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      postgres-intranet:
        condition: service_healthy
    restart: unless-stopped

  modulo-reparto:
    build:
      context: ./microservicios/Nexopostal
      dockerfile: Nexopostal.Reparto/Dockerfile
    container_name: nexopostal-modulo-reparto
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_REPARTO_HOST};Port=${POSTGRES_REPARTO_PORT};Database=${POSTGRES_REPARTO_DB};Username=${POSTGRES_REPARTO_USER};Password=${POSTGRES_REPARTO_PASSWORD}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES}
    expose:
      - "80"
    networks:
      - nexopostal-net
    depends_on:
      postgres-reparto:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # BASES DE DATOS (PostgreSQL)
  # ============================================
  postgres-auth:
    image: postgres:16-alpine
    container_name: nexopostal-postgres-auth
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-ciudadano:
    image: postgres:16-alpine
    container_name: nexopostal-postgres-ciudadano
    environment:
      POSTGRES_DB: ${POSTGRES_CIUDADANO_DB}
      POSTGRES_USER: ${POSTGRES_CIUDADANO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CIUDADANO_PASSWORD}
    volumes:
      - postgres-ciudadano-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CIUDADANO_USER} -d ${POSTGRES_CIUDADANO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-intranet:
    image: postgres:16-alpine
    container_name: nexopostal-postgres-intranet
    environment:
      POSTGRES_DB: ${POSTGRES_INTRANET_DB}
      POSTGRES_USER: ${POSTGRES_INTRANET_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INTRANET_PASSWORD}
    volumes:
      - postgres-intranet-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_INTRANET_USER} -d ${POSTGRES_INTRANET_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-reparto:
    image: postgres:16-alpine
    container_name: nexopostal-postgres-reparto
    environment:
      POSTGRES_DB: ${POSTGRES_REPARTO_DB}
      POSTGRES_USER: ${POSTGRES_REPARTO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_REPARTO_PASSWORD}
    volumes:
      - postgres-reparto-data:/var/lib/postgresql/data
    networks:
      - nexopostal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPARTO_USER} -d ${POSTGRES_REPARTO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ============================================
# NETWORKS
# ============================================
networks:
  nexopostal-net:
    driver: bridge
    name: nexopostal-net

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres-auth-data:
    name: nexopostal-postgres-auth-data
  postgres-ciudadano-data:
    name: nexopostal-postgres-ciudadano-data
  postgres-intranet-data:
    name: nexopostal-postgres-intranet-data
  postgres-reparto-data:
    name: nexopostal-postgres-reparto-data